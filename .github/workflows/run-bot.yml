name: Telegram Auto Sender Bot

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Telegram Script
        run: |
          python bot.py

      - name: Auto Loop Trigger (২৪/৭ সচল রাখার জন্য)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "সার্ভার ঘুমিয়ে পড়া বন্ধ করতে নতুন ওয়ার্কফ্লো শুরু হচ্ছে..."
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
            -d '{"ref":"main"}'
